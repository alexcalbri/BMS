# Manual job: resolves the dependencies of every build profile and generates
# gradle/verification-metadata.xml, then uploads it as an artifact for review.
# It does NOT commit anything and verification is not enabled by it: see SELF_HOSTING.md
# ("Supply chain: Gradle wrapper, daemon JVM and dependency verification").
name: Verification metadata

on:
  workflow_dispatch:

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: liberica
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # Each invocation adds the artifacts it resolves to the same file (Gradle merges them). The three
      # profiles of settings.gradle.kts are covered: full (app + server), serverOnly and webOnly.
      # Only sha256 checksums: PGP keys are not trusted blindly here; review the diff before adopting.
      - name: Full profile (server, app, Android)
        run: >
          ./gradlew --write-verification-metadata sha256 --continue
          :server:testClasses :app:shared:compileKotlinJvm :app:shared:compileKotlinJs
          :app:shared:compileAndroidMain :app:desktopApp:classes :app:androidApp:assembleDebug
      - name: serverOnly profile
        run: ./gradlew -PserverOnly=true --write-verification-metadata sha256 --continue :server:testClasses :server:installDist
      - name: webOnly profile
        run: ./gradlew -PwebOnly=true --write-verification-metadata sha256 --continue :app:webApp:jsBrowserDistribution
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Resumen
        run: |
          test -f gradle/verification-metadata.xml
          echo "Componentes: $(grep -c '<component ' gradle/verification-metadata.xml)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          retention-days: 14
          if-no-files-found: error
