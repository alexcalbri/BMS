# Scans commits for hardcoded secrets, including generic passwords and connection strings
# that GitHub secret scanning only detects for organizations with GitHub Secret Protection.
name: Gitleaks

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets gitleaks comment on the pull request lines where it finds a secret.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so every commit of the push or pull request is scanned.
          fetch-depth: 0
      # No GITLEAKS_LICENSE: it is only required for repositories owned by an organization.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
