# Daemon JVM criteria: any JDK 21 already installed (Ubuntu OpenJDK on the server, Liberica/Temurin in CI).
# No toolchainVendor and no toolchainUrl.* lines: Gradle has no download URL, so it never fetches a JDK
# by itself (it fails with a clear message if no JDK 21 is installed). Do not regenerate with
# `./gradlew updateDaemonJvm` without removing those lines again.
toolchainVersion=21
