ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ com.ideasdeveloper.bms.server.app.ApplicationKt.module ];
    }
}

http {
    # Largest request body of any route that is not an upload (bytes, SECURITY_FIXES.md B10).
    maxRequestBodyBytes = "4194304"
    maxRequestBodyBytes = ${?MAX_REQUEST_BODY_BYTES}
}

database {
    url = "jdbc:postgresql://localhost:5432/bms"
    url = ${?DB_URL}
    user = "bms"
    user = ${?DB_USER}
    password = ${DB_PASSWORD}
    driver = "org.postgresql.Driver"
    maxPoolSize = 10
    maxPoolSize = ${?DB_POOL_SIZE}
}

tenant {
    databases = "[]"
    databases = ${?TENANT_DATABASES_JSON}
    defaultSchema = "public"
    defaultSchema = ${?DEFAULT_SCHEMA}
}
auth {
    sessionLifetimeSeconds = 3600
    sessionLifetimeSeconds = ${?SESSION_LIFETIME_SECONDS}
}

provisioning {
    administrationJdbcUrl = ${?PROVISIONING_DB_URL}
    # Login used only for creating, migrating and deleting companies (SELF_HOSTING.md, Roles de PostgreSQL).
    user = ${?DB_PROVISIONING_USER}
    password = ${?DB_PROVISIONING_PASSWORD}
    tenantJdbcUrlPrefix = ${?TENANT_JDBC_URL_PREFIX}
    migrationsRoot = "."
    migrationsRoot = ${?MIGRATIONS_ROOT}
}

company {
    backupsRoot = "build/company-backups"
    backupsRoot = ${?COMPANY_BACKUPS_ROOT}
    # Files the modules store for each company (e.g. CRM attachments): {filesRoot}/{company}/{module}/...
    filesRoot = "build/company-files"
    filesRoot = ${?COMPANY_FILES_ROOT}
    # Uploads are refused while the files volume has less free space than this (bytes; STORAGE_QUOTA.md).
    minFreeDiskBytes = "2147483648"
    minFreeDiskBytes = ${?COMPANY_FILES_MIN_FREE_BYTES}
    # Uploads in progress at the same time per company.
    maxConcurrentUploads = "4"
    maxConcurrentUploads = ${?COMPANY_FILES_MAX_CONCURRENT_UPLOADS}
}

modules {
    catalogUrl = ""
    catalogUrl = ${?MODULE_CATALOG_URL}
    packagesRoot = "build/server-modules"
    packagesRoot = ${?MODULE_PACKAGES_ROOT}
    # Optional GitHub token (read-only, public repositories) for the catalog and module downloads.
    githubToken = ""
    githubToken = ${?MODULE_GITHUB_TOKEN}
}

extensions {
    # Carpeta extensions/ de GitHub (https://github.com/<owner>/<repo>/tree/<commit>/extensions).
    # Vacia = la carpeta extensions/ del repositorio del catalogo de modulos.
    catalogUrl = ""
    catalogUrl = ${?EXTENSION_CATALOG_URL}
}

version {
    catalogUrl = ""
    catalogUrl = ${?VERSION_CATALOG_URL}
}

mail {
    host = ""
    host = ${?SMTP_HOST}
    port = "587"
    port = ${?SMTP_PORT}
    username = ""
    username = ${?SMTP_USERNAME}
    password = ""
    password = ${?SMTP_PASSWORD}
    from = ""
    from = ${?SMTP_FROM}
    security = "starttls"
    security = ${?SMTP_SECURITY}
}
